name: emulator-checks
title: "Emulator game (AppImage or Flatpak emulator)"
tags: [games]
needs: [probe]
timeout_s: 60
steps:
  - goto: open:game:${emulator}
  - wait_for: {focus: '"(Play|Resume|Open)', timeout_ms: 8000}
  - name: the page is up, nothing is started
    goto: tab:home
  - wait_for: {screen: {tab: home}, timeout_ms: 5000}
