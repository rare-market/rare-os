# Holding a direction through the long lists (Library grid, Marketplace grid and activity, Wallet lists):
# the ring keeps up, scrolling stays smooth at 60 fps, nothing blanks, focus is never lost at the end.
name: list-scroll
title: Scroll the long lists with held directions, smooth and without losing focus
tags: [navigation, launcher, smoothness]
needs: [probe]
timeout_s: 180
steps:
