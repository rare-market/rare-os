    expect: {screen: {tab: library}}
  # Down to the last row of the grid, then back up to the first.
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: up
  - press: up
  - press: up
  - press: up
  - press: up
  - press: up
  - press: up
  - press: up
  - press: up
  - press: up
  # Sections with LT/RT keep focus.
  - press: rt
    expect: {respond_ms: 250}
  - press: lt
    expect: {respond_ms: 250}
  - goto: market
    expect: {screen: {tab: market}}
  - press: down
  - press: a
    expect: {respond_ms: 400}
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  # Activity and Holders lists with RT.
