    expect: {respond_ms: 300}
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: rt
    expect: {respond_ms: 300}
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: b
  - goto: wallet
    expect: {screen: {tab: wallet}}
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
  - press: down
# device checklist
# - Hold Down on Library from first to last row: no stalls, no tiles blinking, the page keeps the focused row about 45% from the top.
# - The sticky filter row never covers the focused tile.
# - Scroll position survives a library rescan (Guide out of a game and back).
