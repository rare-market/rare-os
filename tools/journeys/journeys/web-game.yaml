name: web-game-checks
title: "Web game, in Rare's window and in Chrome"
tags: [games, web]
needs: [probe, network]
timeout_s: 60
steps:
  - goto: open:game:${web_game}
  - wait_for: {focus: '"(Play|Resume|Open)', timeout_ms: 8000}
  - name: the page is up, nothing is started
    goto: tab:home
  - wait_for: {screen: {tab: home}, timeout_ms: 5000}
