name: chrome-app-youtube
title: "YouTube (TV layout in Chrome)"
tags: [apps, chrome]
needs: [probe, network]
timeout_s: 60
steps:
  - goto: open:app:${chrome_app}
  - wait_for: {focus: '"Open"|"Resume"', timeout_ms: 8000}
  - name: the page is up, nothing is started
    goto: tab:home
  - wait_for: {screen: {tab: home}, timeout_ms: 5000}
# device checklist (full flow: core/chrome-app.yaml (same app); not automated: Chrome-uninstalled toast)
