#   Journal: flatpak run com.google.Chrome --app=https://www.youtube.com/tv --user-data-dir=/home/<user>/.var/app/com.google.Chrome/data/rare-apps/youtube
# - Do: d-pad, A, B on the pad
#   Expect: YouTube TV moves, plays, goes back (Chrome reads the pad through the Gamepad API; Rare sends nothing in gamepad mode)
# - Do: hold View
#   Expect: the panel for YouTube
# - Do: in the panel, Quit (A twice)
#   Expect: Rare Home; YouTube gone from Running
# - Do: on Home press View right after
#   Expect: nothing opens (before the fix this opened Steam Big Picture)
# - Do: open YouTube again, press the Rare button
#   Expect: Rare Home; YouTube in Running; Resume brings it back
