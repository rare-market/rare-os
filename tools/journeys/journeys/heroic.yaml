name: heroic
title: "Heroic (Epic, GOG) game"
tags: [games]
needs: [probe]
timeout_s: 60
steps:
  - goto: tab:library
  - wait_for: {screen: {tab: library}, timeout_ms: 5000}
  - goto: tab:home
  - wait_for: {screen: {tab: home}, timeout_ms: 5000}
