name: Rare OS image

# Runs only when started by hand (Actions > Rare OS image > Run workflow) or for a
# release tag (v*). Each run takes 1-2 hours of runner time; day-to-day image builds
# belong on the build machine (image/vm/test.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      fresh_test:
        description: Install the image to a VM disk and boot it to the launcher
        type: boolean
        default: true
      rebase_test:
        description: Switch a stock Fedora bootc VM to Rare OS with get-rare-os.sh, then roll back
        type: boolean
        default: true
      build_iso:
        description: Build the USB installer ISO (not uploaded, checks that it builds)
        type: boolean
        default: false
      publish:
        description: Push to the image repo (RARE_IMAGE_REPO) and sign with cosign (the package must be public for devices to pull it)
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: localhost/rare-os:test
  REGISTRY_IMAGE: ${{ vars.RARE_IMAGE_REPO || format('ghcr.io/{0}', github.repository) }}
  STORAGE: /mnt/containers/storage
  WORK: /var/tmp/rare-vm
  OUT: ${{ github.workspace }}/out

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /opt/microsoft \
            /opt/google /usr/local/lib/node_modules /usr/local/share/chromium /opt/az
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile
          df -h / /mnt
          nproc; free -g

      - name: Podman storage on the larger disk
        run: |
          sudo mkdir -p "$STORAGE" "$WORK"
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "%s"\n' "$STORAGE" | sudo tee /etc/containers/storage.conf
          sudo podman info --format '{{.Store.GraphRoot}} {{.Version.Version}}'

      - name: Install QEMU
        run: |
          # man-db triggers make apt very slow on runners.
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf >/dev/null
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "No KVM on this runner: VMs run under TCG (slow)"

      - name: Build image
        id: build
        run: |
          sudo podman build --pull=newer -f image/Containerfile -t "$IMAGE" \
            --build-arg RARE_VERSION=0.1.${{ github.run_number }} --build-arg RARE_IMAGE_REPO="$REGISTRY_IMAGE" .
          # Drop the launcher build stage; the runner has about 50 GB in total.
          sudo podman image prune -f
          sudo podman images
          df -h /

      - name: VM test, fresh install
        if: steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.fresh_test)
        run: sudo -E image/vm/test.sh fresh

      - name: Installer ISO
        if: steps.build.outcome == 'success' && inputs.build_iso && !cancelled()
        run: |
          mkdir -p "$WORK/iso"
          # The installed system follows the ref the ISO is built from (bib's %post bootc switch):
          # build from the one devices follow, never localhost/rare-os:test.
          sudo podman tag "$IMAGE" "$REGISTRY_IMAGE:stable"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v "$PWD/image/installer/config.toml:/config.toml:ro" -v "$WORK/iso:/output" \
            -v "$STORAGE:/var/lib/containers/storage" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --use-librepo=True "$REGISTRY_IMAGE:stable"
          sudo apt-get install -y -qq --no-install-recommends xorriso mtools >/dev/null
          sudo image/installer/finish-iso.sh "$WORK/iso/bootiso/install.iso" "$WORK/iso/rare-os-installer.iso"
          sudo find "$WORK/iso" -name '*.iso' -exec ls -lh {} \;
          sudo rm -rf "$WORK/iso"

      - name: VM test, switch from a stock OS and roll back
        if: steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.rebase_test) && !cancelled()
        run: sudo -E FREE_AFTER_PUSH=${{ inputs.publish && '0' || '1' }} image/vm/test.sh rebase

      - name: Publish and sign
        if: steps.build.outcome == 'success' && inputs.publish && !cancelled()
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in stable 0.1.${{ github.run_number }}; do
            sudo podman push --digestfile /tmp/digest "$IMAGE" "docker://$REGISTRY_IMAGE:$tag"
          done
          curl -fsSLo /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 && chmod +x /tmp/cosign
          echo "$GH_TOKEN" | /tmp/cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          /tmp/cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REGISTRY_IMAGE@$(cat /tmp/digest)"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-screens-${{ github.run_number }}
          retention-days: 5
          if-no-files-found: ignore
          path: |
            out/*.png
            out/*.txt
            out/*.log
