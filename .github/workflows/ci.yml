name: CI

# Compile and unit tests of the launcher's Rust side on GitHub-hosted runners.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # One target dir for the three workspaces, no debug info: the runner's disk is small.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: System deps
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev \
            libssl-dev libxdo-dev build-essential pkg-config libdbus-1-dev perl libclang-dev \
            libxkbcommon-dev libwayland-dev fonts-noto-color-emoji

      - uses: dtolnay/rust-toolchain@stable

      - name: Test the launcher crates (unit tests)
        run: cargo test --lib --no-fail-fast --manifest-path launcher/crates/Cargo.toml

      - name: Test the render engine (unit tests)
        run: cargo test --lib --manifest-path launcher/render/Cargo.toml

      - name: Test the native launcher (unit tests)
        run: cargo test --lib --manifest-path launcher/native/Cargo.toml

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
