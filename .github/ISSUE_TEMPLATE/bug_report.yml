name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Settings > About on the device.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: SuiPlay0X1, Rare OS 43.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: The logs from Settings > System > Support > "Logs for a bug report", or the relevant log lines. Remove anything private, such as wallet addresses you do not want to share.
