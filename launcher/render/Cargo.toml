[workspace]
resolver = "2"
members = ["engine", "home-poc"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# taffy 0.15.1 patched: a leaf or hidden containing block drops its stale hoisted list (the "Rare patch" comments).
[patch.crates-io]
taffy = { path = "vendor/taffy" }
