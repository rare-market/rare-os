[package]
name = "rare-stream"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "PC game streaming through Moonlight: discovery, pairing, app lists, Wake-on-LAN. UI-independent."

[dependencies]
rare-core = { path = "../rare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
dirs = "6"
mdns-sd = "=0.21.4"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
uuid = "1"
