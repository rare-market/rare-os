[package]
name = "rare-trophies"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rare Trophies, native side: achievements from Steam (local files), Epic and GOG, Rare's own milestones for every game, the Rare score, badge art, the unlock watcher and the attestation POST. UI-independent."

[dependencies]
rare-core = { path = "../rare-core" }
rare-library = { path = "../rare-library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
flate2 = "1"
ureq = { version = "2", features = ["json"] }
