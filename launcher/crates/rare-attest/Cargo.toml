[package]
name = "rare-attest"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rare device attestation: proves this device is a genuine SuiPlay to rare.market's attestor (TPM EK chain, credential activation, PCR 0/4/7 quote) and returns a signed device claim and a Device Pass voucher. UI-independent."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
