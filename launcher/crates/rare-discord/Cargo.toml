[package]
name = "rare-discord"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Discord on Rare: Rich Presence through arRPC (or the Discord app's own socket), and mute/deafen of Discord's voice. UI-independent."

[dependencies]
rare-core = { path = "../rare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
