[package]
name = "rare-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rare's data cache: keyed JSON in memory, persisted to disk, stale-while-revalidate over HTTP, warmed at start"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
