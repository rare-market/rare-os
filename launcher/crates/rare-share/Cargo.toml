[package]
name = "rare-share"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The Share button: screenshots and clips (capture backends, index, recorder supervisor). UI-independent."

[dependencies]
rare-core = { path = "../rare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webp = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
x11rb = { version = "0.13", features = ["res"] }
url = "2"

[dev-dependencies]
tempfile = "3"
