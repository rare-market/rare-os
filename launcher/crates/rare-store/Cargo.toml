[package]
name = "rare-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rare Store installs: signed download, hash check against the chain, safe unpack, licence gate. UI-independent."

[dependencies]
rare-core = { path = "../rare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ureq = { version = "2", features = ["json"] }
dirs = "6"
sha2 = "0.10"
ruzstd = "0.8"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
