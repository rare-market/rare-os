[package]
name = "rare-market"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rare's marketplace logic: rare.market /v1 client over rare-state, venue buy/sell/list/cancel builders, offers, inventory"

[dependencies]
rare-core = { path = "../rare-core" }
rare-state = { path = "../rare-state" }
rare-sui = { path = "../rare-sui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
regex = "1"
url = "2"
tokio = { version = "1.40", features = ["rt"] }

[features]
# Fixtures for golden images and offline runs.
mock = []

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time"] }
