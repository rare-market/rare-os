[package]
name = "rare-overlay"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rare over a game: the Rare menu, the Switcher, the focus keeper and gamescope's base-layer atoms, guest mode, and the journey probe. UI-independent."

[dependencies]
rare-core = { path = "../rare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["res"] }
