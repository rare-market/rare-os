<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rare: add games</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #100c18; color: #f2f2f3; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #a09cab; margin: 0 0 18px; }
  #drop { display: block; border: 2px dashed #4a4458; border-radius: 14px; padding: 32px 16px; text-align: center; cursor: pointer; }
  #drop.over { border-color: #3d5afe; background: #191523; }
  #drop b { display: block; font-size: 18px; margin-bottom: 4px; }
  input[type=file] { display: none; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { background: #191523; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { color: #a09cab; font-size: 14px; white-space: nowrap; }
  .ok { color: #4caf50; } .err { color: #ff6b6b; }
  progress { width: 100%; height: 6px; margin-top: 8px; accent-color: #3d5afe; }
  select, button { font: inherit; color: inherit; background: #231e2f; border: 1px solid #4a4458; border-radius: 8px; padding: 6px 8px; margin-top: 8px; }
  button { background: #3d5afe; border-color: #3d5afe; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1 id="t-title">Add games to Rare</h1>
  <p id="t-intro">Pick or drop your game files. Each goes into its system's folder on the device and shows up in Library.</p>
  <label id="drop"><b id="t-pick">Choose files</b><span id="t-or">or drop them here</span><input id="files" type="file" multiple></label>
  <ul id="list"></ul>
</main>
<script>
const ru = (navigator.language || "").toLowerCase().startsWith("ru");
const T = ru ? {
  title: "Добавить игры в Rare", intro: "Выберите или перетащите файлы игр. Каждый попадёт в папку своей системы на приставке и появится в Библиотеке.",
  pick: "Выбрать файлы", or: "или перетащите их сюда", wait: "в очереди", send: "отправляется", done: "готово", which: "Для какой системы этот файл?",
  go: "Отправить", notgame: "не файл игры", fail: "ошибка", gone: "нет связи с приставкой"
} : {
  title: "Add games to Rare", intro: "Pick or drop your game files. Each goes into its system's folder on the device and shows up in Library.",
  pick: "Choose files", or: "or drop them here", wait: "waiting", send: "sending", done: "done", which: "Which system is this file for?",
  go: "Send", notgame: "not a game file", fail: "failed", gone: "can't reach the device"
};
for (const k of ["title", "intro", "pick", "or"]) document.getElementById("t-" + k).textContent = T[k];
document.title = T.title;

const queue = [];
let busy = false;

function row(file) {
  const li = document.createElement("li");
  li.innerHTML = '<div class="row"><span class="name"></span><span class="state"></span></div>';
  li.querySelector(".name").textContent = file.name;
  document.getElementById("list").prepend(li);
  return li;
}
function state(li, text, cls) {
  const s = li.querySelector(".state");
  s.textContent = text;
  s.className = "state " + (cls || "");
}
function add(files) {
  for (const f of files) {
    const li = row(f);
    state(li, T.wait);
    queue.push({ file: f, li, system: "" });
  }
  next();
}
function next() {
  if (busy || !queue.length) return;
  busy = true;
  send(queue.shift());
}
function send(job) {
  const { file, li } = job;
  const bar = li.querySelector("progress") || li.appendChild(document.createElement("progress"));
  bar.max = 1; bar.value = 0;
  state(li, T.send);
  const x = new XMLHttpRequest();
  x.open("POST", "file?name=" + encodeURIComponent(file.name) + "&system=" + encodeURIComponent(job.system));
  x.upload.onprogress = (e) => { if (e.lengthComputable) bar.value = e.loaded / e.total; };
  x.onload = () => {
    let r = {};
    try { r = JSON.parse(x.responseText); } catch (_) {}
    if (x.status === 200) {
      bar.remove();
      state(li, T.done + " · " + r.system, "ok");
    } else if (x.status === 409 && r.choices) {
      bar.remove();
      state(li, "");
      ask(job, r.choices);
    } else {
      bar.remove();
      state(li, x.status === 400 ? T.notgame : T.fail, "err");
    }
    busy = false;
    next();
  };
  x.onerror = () => { bar.remove(); state(li, T.gone, "err"); busy = false; next(); };
  x.send(file);
}
function ask(job, choices) {
  const box = document.createElement("div");
  const label = document.createElement("div");
  label.className = "state";
  label.textContent = T.which;
  const sel = document.createElement("select");
  for (const c of choices) {
    const o = document.createElement("option");
    o.value = c.id; o.textContent = c.name;
    sel.appendChild(o);
  }
  const b = document.createElement("button");
  b.textContent = T.go;
  b.onclick = () => { box.remove(); job.system = sel.value; queue.unshift(job); next(); };
  box.append(label, sel, b);
  job.li.appendChild(box);
}

const drop = document.getElementById("drop");
document.getElementById("files").onchange = (e) => { add(e.target.files); e.target.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
</script>
</body>
</html>
