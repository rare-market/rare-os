<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- rare-fand. Only root owns the name. Anyone may read the fan and battery state; changing
     them is checked by the service against polkit (org.rare.fan.set, org.rare.battery.set:
     the active local session). -->
<busconfig>
  <policy user="root">
    <allow own="org.rare.Fan"/>
    <allow send_destination="org.rare.Fan"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.rare.Fan" send_interface="org.rare.Fan"/>
    <allow send_destination="org.rare.Fan" send_interface="org.rare.Battery"/>
    <allow send_destination="org.rare.Fan" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.rare.Fan" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.rare.Fan" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
