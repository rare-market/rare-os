# Rare OS: Waydroid's image channels (Library > Android sets Android up with these).
# With them in place, `waydroid init` and the container service's D-Bus Init use the vanilla
# LineageOS images (no Google apps) without asking for a password.
[channels]
system_channel = https://ota.waydro.id/system
vendor_channel = https://ota.waydro.id/vendor
rom_type = lineage
system_type = VANILLA
