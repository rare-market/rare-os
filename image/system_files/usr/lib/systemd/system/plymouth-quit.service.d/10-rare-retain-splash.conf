# Quit the boot splash without clearing it: the picture stays on the screen until gamescope's
# first frame replaces it, so there is no black or text gap between the splash and the launcher.
# plymouth-quit still runs before sddm, so plymouthd has let go of the display before gamescope
# opens it.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
