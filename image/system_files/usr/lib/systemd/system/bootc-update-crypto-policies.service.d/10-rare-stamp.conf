# Same as bootc-update-ca-trust: only when the deployment or the chosen policy changed.
[Service]
ExecCondition=/usr/libexec/rare/boot-stamp check crypto-policies /etc/crypto-policies/config /etc/crypto-policies/local.d
ExecStartPost=/usr/libexec/rare/boot-stamp write crypto-policies /etc/crypto-policies/config /etc/crypto-policies/local.d
