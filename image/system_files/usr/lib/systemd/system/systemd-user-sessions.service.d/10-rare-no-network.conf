# Logins (and so sddm, the game-mode autologin and the launcher) do not wait for the network.
# Stock systemd-user-sessions is After=network.target and remote-fs.target; network.target waits
# for NetworkManager and wpa_supplicant, and remote-fs.target for nfs-client/gssproxy, which put
# NetworkManager (~0.8 s) and everything before it on the path to the first frame. A handheld
# has no network mounts at boot. Same two orderings as stock, minus those.
[Unit]
After=
After=nss-user-lookup.target home.mount
