# update-ca-trust took 1.8 s of every boot, and sysinit.target (so everything after it) waited.
# Run it when the deployment or the local trust sources changed, not on every boot.
[Service]
ExecCondition=/usr/libexec/rare/boot-stamp check ca-trust /etc/pki/ca-trust/source
ExecStartPost=/usr/libexec/rare/boot-stamp write ca-trust /etc/pki/ca-trust/source
