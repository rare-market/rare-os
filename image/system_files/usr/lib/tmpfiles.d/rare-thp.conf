# Transparent huge pages for games: Wine and Proton never madvise, so with the Fedora default
# (madvise) every game runs on 4 KiB pages. Measured 17% lower random-access latency with 2 MiB
# pages. defrag stays madvise so page faults never stall
# in direct compaction. max_ptes_none 64 makes khugepaged collapse only mostly populated regions
# and lets the THP shrinker split huge pages that are mostly zero.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - always
w /sys/kernel/mm/transparent_hugepage/defrag - - - - madvise
w /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 64
