# Rare OS: the launcher (a wheel user) sets the CPU energy preference with its power profile
# (Quiet: power, Balanced: balance_power, Performance: balance_performance). scx_lavd's
# --autopower follows it. Only the hint becomes writable; clocks and limits stay root-only.
z /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference 0664 root wheel -
