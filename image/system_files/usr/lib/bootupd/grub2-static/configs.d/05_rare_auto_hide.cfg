# Rare OS: boot counting and a hidden menu after a good boot, for installs with bootupd's
# static GRUB config (which shows the menu for 1 s every time and has neither). Same variables
# and behaviour as Fedora's generated config (08_fallback_counting, 10_reset_boot_success,
# 12_menu_auto_hide), so greenboot, grub-boot-success.timer, grub2-set-bootflag and
# `ujust configure-grub` work the same on both kinds of install.

# Fedora keeps the environment in a reserved block on btrfs /boot (env_block).
function rare_save_env {
  if [ "${env_block}" ]; then
    save_env -f "${env_block}" $@
  else
    save_env $@
  fi
}

# A boot counts as good once userspace sets boot_success=1 (grub-boot-success.timer, 2 min
# after login). The menu may hide if the last boot was good or this entry is new.
if [ "${boot_success}" = "1" -o "${boot_indeterminate}" = "1" ]; then
  set menu_hide_ok=1
else
  set menu_hide_ok=0
fi

# greenboot: after an update it sets boot_counter; each unfinished boot counts down and at
# zero the previous deployment (entry 1) boots.
insmod increment
if [ -n "${boot_counter}" -a "${boot_success}" = "0" ]; then
  if [ "${boot_counter}" = "0" -o "${boot_counter}" = "-1" ]; then
    set default=1
    set boot_counter=-1
  else
    decrement boot_counter
  fi
  rare_save_env boot_counter
fi

if [ "${boot_success}" = "1" ]; then
  set boot_indeterminate=0
elif [ "${boot_indeterminate}" = "1" ]; then
  set boot_indeterminate=2
fi
set boot_success=0
rare_save_env boot_success boot_indeterminate

# menu_auto_hide (set by rare-boot-menu.service, or `ujust configure-grub hide`): no menu
# after a good boot; holding Shift or pressing Esc still shows it. menu_show_once forces it once.
if [ x$feature_timeout_style = xy ]; then
  if [ "${menu_show_once}" ]; then
    unset menu_show_once
    rare_save_env menu_show_once
    set timeout_style=menu
    set timeout=60
  elif [ "${menu_auto_hide}" -a "${menu_hide_ok}" = "1" ]; then
    # A modifier key held at power-on shows the menu for 30 s (keystatus works on
    # most firmware, not all). Esc during the 1 s wait does the same (GRUB's own hidden-menu behaviour).
    # Handheld buttons that are not keyboard keys GRUB maps (volume, Quick Access) cannot
    # be tested here.
    insmod keystatus
    set rare_key_menu=0
    if keystatus --shift; then set rare_key_menu=1; fi
    if keystatus --ctrl; then set rare_key_menu=1; fi
    if keystatus --alt; then set rare_key_menu=1; fi
    if [ "${rare_key_menu}" = "1" ]; then
      set timeout_style=menu
      set timeout=30
    elif [ "${fastboot}" = "1" ]; then
      set timeout_style=menu
      set timeout=0
    else
      set timeout_style=hidden
      set timeout=1
    fi
  fi
fi
