# Rare OS: speaker protection and gentle voicing for the SuiPlay0X1's internal speakers.
# Shipped to every Rare OS image; rare-speaker-eq-gate removes this file at boot on any other
# machine, so it only ever loads on a SuiPlay0X1.
#
# A virtual sink "Rare Speakers" (priority 950, above the ALSA analog sink's 900) feeds the
# analog sink. Per channel:
#   in -> copy --+-> trim -> 4th-order 150 Hz high-pass -> 3 gentle EQ bands
#                |        -> CAPS CompressX2 (soft saturating limiter) -> clamp at -0.5 dBFS --> mix In 1
#                +--------------------------------------------------------------------------> mix In 2
# The speaker and the headphones are two ports of ONE ALSA sink, so a chain on that sink cannot
# tell them apart. The mixer is the switch: speaker port = wet (Gain 1 = 1, Gain 2 = 0),
# headphone port = dry (Gain 1 = 0, Gain 2 = 1). /usr/libexec/rare/speaker-eq-route, a user
# service, flips it when the active port changes. Bluetooth, USB and HDMI are other sinks and
# never pass through this chain (HDMI is raised above it by 61-rare-hdmi-priority.conf).
#
# Tonal bands are priors, not measurements: nothing here boosts more than +1.5 dB or touches
# anything below 200 Hz upward. Replace with measured bands.
# Limiter: CAPS CompressX2 mode 1 (strength/threshold barely matter; the saturator does the work).
# The clamp is the hard -0.5 dBFS guarantee (0.944 linear).
#
# Loudness ("Louder speakers", on by default; ~/.config/rare/speakers.json, set by the launcher
# and speaker-eq-route): trim 1.0 and limiter makeup +9 dB. Off: trim 0.841 (-1.5 dB) and +2.5 dB.
# Measured on the device through a null sink (pw-record, nothing audible), 1 kHz sine in / pink
# noise at -18 dBFS RMS (peaks -1 dBFS) in:
#                     sine -20      sine -6       sine -1       pink RMS (peak)
#   off (0.841/2.5)   -21.6 pk      -10.5 pk      -7.1 pk       -22.7 (-10.4)
#   on  (1.0/9)       -13.8 pk       -4.7 pk      -2.8 pk       -15.4 (-4.4)
# so about +7.5 dB on ordinary content, peaks still bounded below -0.5 dBFS by the limiter + clamp.
# The ALSA sink under this chain is pinned at 0 dB on the speaker port by speaker-eq-route.
#
# Live test without restarting anything: tools/audio/speaker-eq-live-test.sh. It takes the text
# between the BEGIN-ARGS and END-ARGS markers below, so keep those lines in place.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      #BEGIN-ARGS
      node.description = "Rare Speakers"
      media.name = "Rare Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = inL label = copy }
          { type = builtin name = inR label = copy }
          { type = builtin name = trimL label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
          { type = builtin name = trimR label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
          { type = builtin name = hp1L label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.541 "Gain" = 0.0 } }
          { type = builtin name = hp2L label = bq_highpass control = { "Freq" = 150.0 "Q" = 1.307 "Gain" = 0.0 } }
          { type = builtin name = hp1R label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.541 "Gain" = 0.0 } }
          { type = builtin name = hp2R label = bq_highpass control = { "Freq" = 150.0 "Q" = 1.307 "Gain" = 0.0 } }
          { type = builtin name = bodyL label = bq_peaking control = { "Freq" = 250.0 "Q" = 0.9 "Gain" = 1.5 } }
          { type = builtin name = presL label = bq_peaking control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = -1.5 } }
          { type = builtin name = airL label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 1.5 } }
          { type = builtin name = bodyR label = bq_peaking control = { "Freq" = 250.0 "Q" = 0.9 "Gain" = 1.5 } }
          { type = builtin name = presR label = bq_peaking control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = -1.5 } }
          { type = builtin name = airR label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 1.5 } }
          { type = ladspa name = lim plugin = "/usr/lib64/ladspa/caps.so" label = CompressX2
            control = { "measure" = 0 "mode" = 1 "threshold" = 0.5 "strength" = 0.25 "attack" = 0.75 "release" = 0.5 "gain (dB)" = 9.0 } }
          { type = builtin name = clampL label = clamp control = { "Min" = -0.944 "Max" = 0.944 } }
          { type = builtin name = clampR label = clamp control = { "Min" = -0.944 "Max" = 0.944 } }
          { type = builtin name = mixL label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
          { type = builtin name = mixR label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
        ]
        links = [
          { output = "inL:Out"   input = "trimL:In" }
          { output = "trimL:Out" input = "hp1L:In" }
          { output = "hp1L:Out"  input = "hp2L:In" }
          { output = "hp2L:Out"  input = "bodyL:In" }
          { output = "bodyL:Out" input = "presL:In" }
          { output = "presL:Out" input = "airL:In" }
          { output = "airL:Out"  input = "lim:in.l" }
          { output = "lim:out.l" input = "clampL:In" }
          { output = "clampL:Out" input = "mixL:In 1" }
          { output = "inL:Out"   input = "mixL:In 2" }
          { output = "inR:Out"   input = "trimR:In" }
          { output = "trimR:Out" input = "hp1R:In" }
          { output = "hp1R:Out"  input = "hp2R:In" }
          { output = "hp2R:Out"  input = "bodyR:In" }
          { output = "bodyR:Out" input = "presR:In" }
          { output = "presR:Out" input = "airR:In" }
          { output = "airR:Out"  input = "lim:in.r" }
          { output = "lim:out.r" input = "clampR:In" }
          { output = "clampR:Out" input = "mixR:In 1" }
          { output = "inR:Out"   input = "mixR:In 2" }
        ]
        inputs  = [ "inL:In" "inR:In" ]
        outputs = [ "mixL:Out" "mixR:Out" ]
      }
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "rare_speaker_eq"
        media.class = Audio/Sink
        priority.session = 950
        priority.driver = 950
      }
      playback.props = {
        node.name = "rare_speaker_eq_out"
        node.passive = true
        target.object = "alsa_output.pci-0000_c4_00.6.analog-stereo"
      }
      #END-ARGS
    }
  }
]
