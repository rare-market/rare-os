# Rare OS copy of /usr/share/alsa-card-profile/mixer/paths/analog-input-internal-mic.conf
# (PipeWire 1.6 ACP reads /etc/alsa-card-profile/mixer/paths first, spa/plugins/alsa/acp/compat.c
# get_data_path). Two changes, both volume-limit lines, for the SuiPlay0X1's digital mic on the
# ALC269VC (pin 0x12):
# - ACP merges Capture (-17.25..+30 dB) and Internal Mic Boost (0/+10/+20/+30 dB) into one
#   slider, so a source at 100 % (WirePlumber's default) put +60 dB on the codec and clipped
#   20 to 40 % of samples with nobody talking (measured 2026-10-27, after rare-audio-defaults had
#   set +15 dB at boot: ACP raised it back two seconds later). The old WirePlumber rule set
#   api.alsa.soft-mixer on the node, where ACP never reads it.
# - Capture is capped at step 37 (+10.5 dB) and Internal Mic Boost at step 1 (+10 dB): 100 % is
#   +20.5 dB, 5 dB above the level measured as clean for speech at 30 cm (+15 dB).
# Only this path changes; other cards and the headset mic (analog-input-mic.conf) are untouched.
# The shared tail is included by absolute path because a relative .include resolves next to
# this file.
