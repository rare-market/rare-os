# Rare OS: SSH hardening. Installed with the image and rewritten by `os-admin ssh on`.
# sshd keeps the FIRST value it reads for a keyword and reads sshd_config.d in name order, ahead
# of the rest of sshd_config, so this file sorts before the base's 40-redhat-crypto-policies.conf
# and 50-redhat.conf. Password and root login policy is in 00-rare-auth.conf (written by os-admin).
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 4:50:10
PermitEmptyPasswords no
ClientAliveInterval 60
ClientAliveCountMax 3
