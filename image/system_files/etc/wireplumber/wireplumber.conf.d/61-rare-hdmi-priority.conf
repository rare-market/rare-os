# Rare OS: HDMI/DP sinks outrank the "Rare Speakers" chain (950) so a connected display wins the
# default-sink election and never passes through the speaker EQ.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.pci-0000_c4_00.1.hdmi.*" } ]
    actions = { update-props = { priority.session = 1000, priority.driver = 1000 } }
  }
]
